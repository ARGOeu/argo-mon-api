services:
  mongodb:
    image: mongo:7.0
    container_name: argo-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: argo_core
    tmpfs:
      - /data/db
      - /data/configdb
    volumes:
      - ../argo-web-api/init_mongo.js:/docker-entrypoint-initdb.d/init_mongo.js:ro
    networks:
      - argo-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # TODO
  #
  # The ARGO Web API CI pipeline will build and publish the image after successful devel builds.
  #
  # Once available:
  # - Replace docker-argo-web-api:latest with the published image.
  # - Add pull_policy: always to fetch the latest development image.

  argo-web-api:
    image: docker-argo-web-api:latest
    container_name: argo-web-api
    ports:
      - "8843:443"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../argo-web-api/argo-web-api.conf:/etc/argo-web-api.conf:ro
    networks:
      - argo-network
    command: /app/argo-web-api -conf /etc/argo-web-api.conf

networks:
  argo-network:
    driver: bridge